# Put this file at  .github/workflows/scan.yml  in your GitHub repo.
# Full scan: searches Roblox for new hidden gems, then publishes the website to the "site" branch.
name: Scan Roblox

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours (UTC). Change the 6 to 3 for every 3 hours.
  workflow_dispatch:           # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write              # lets the job publish the "site" branch

concurrency:
  group: publish               # scan and tracker never run at the same time
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous data (chart history)
        uses: actions/checkout@v4
        continue-on-error: true          # fails harmlessly on the very first run
        with:
          ref: site
          path: prev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan Roblox
        env:
          ONE_SHOT: "1"
          SCAN_MODE: standard        # quick | standard | deep | max
          ONE_SHOT_MAX_MIN: "100"    # stop after this many minutes and publish what was found
          EXPORT_DIR: site_out
          PREV_DIR: prev
          # Optional proxy: add a repository secret named SMARTPROXY_URL (see DEPLOY.md).
          # Leave the secret out and no proxy is used.
          SMARTPROXY_URL: ${{ secrets.SMARTPROXY_URL }}
          MAX_PROXY_MB: "600"        # stop early after about this much proxy data (0 = no limit)
        run: python roblox_gem_finder.py

      - name: Publish website
        run: |
          cd site_out
          git init -q -b site
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
